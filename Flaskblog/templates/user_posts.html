{% extends "layout.html" %}
{% block content %}
    <h1 class="mb-3">Posts by {{ user.username }}</h1>
    {% for post in posts %}
        <article class="media content-section">
            <div class="media-body">
                <div class="article-metadata d-flex align-items-center gap-2 mb-2">
                    <img class="rounded-circle article-img" 
                         src="{{ url_for('static', filename='profile_pics/' + user.image_file) }}" 
                         alt="Profile Picture">
                    <a class="mr-2" href="{{ url_for('user', username=user.username) }}">{{ user.username }}</a>
                    <small class="text-muted">{{ post.date_posted.strftime("%Y-%m-%d") }}</small>
                </div>
                <h2 class="article-title">
                    <a href="{{ url_for('post', post_id=post.id) }}">{{ post.title }}</a>
                </h2>
                <p class="article-content">{{ post.content }}</p>
            </div>
        </article>
    {% endfor %}
{% endblock %}
